<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <!-- Concept: Circle monogram — timeless, badge-like, works as standalone mark -->

  <!-- Outer ring -->
  <circle cx="24" cy="28" r="20" stroke="#1A1A2E" stroke-width="1.5" fill="none"/>
  <!-- Inner filled circle accent -->
  <circle cx="24" cy="28" r="14" fill="#7C3AED"/>
  <!-- S letterform inside -->
  <path d="M19 22 C19 20 21 19 24 19 C27 19 29 20 29 22 C29 24 27 25 24 27 C21 29 19 30 19 32 C19 34 21 35 24 35 C27 35 29 34 29 32"
        stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- SOLE wordmark -->
  <text x="54" y="24" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="2" fill="#1A1A2E">SOLE</text>

  <!-- Tagline / sub -->
  <text x="55" y="38" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" letter-spacing="5.5" fill="#6B7280">STUDIO</text>

  <!-- Small dot separator -->
  <circle cx="55" cy="43" r="1.5" fill="#7C3AED"/>
  <text x="61" y="44" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="300" letter-spacing="1" fill="#9CA3AF">Strategy · Design · Build</text>
</svg>
